<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191614" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>

    <!-- Subtle Rim Light -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A8E9E" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FAF7F2" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6D8B74" stop-opacity="0.4" />
    </linearGradient>

    <!-- Neural Glow Core -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#72B0C4" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#6D8B74" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#141210" stop-opacity="0" />
    </radialGradient>

    <!-- Left Pillar Gradient (Ice to Oat) -->
    <linearGradient id="pillarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#B8CCD4" />
    </linearGradient>

    <!-- Diagonal Traverse Gradient (Sage to Ice to Lavender) -->
    <linearGradient id="diagBridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D8B74" />
      <stop offset="50%" stop-color="#6A8E9E" />
      <stop offset="100%" stop-color="#8B80A6" />
    </linearGradient>

    <!-- Right Pillar Gradient (Cyber Green to Sage) -->
    <linearGradient id="pillarRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AE5A6" />
      <stop offset="100%" stop-color="#6D8B74" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Ambient Neural Grid Lines -->
  <g opacity="0.10" stroke="#FAF7F2" stroke-width="1.5">
    <line x1="72" y1="160" x2="440" y2="160" />
    <line x1="72" y1="256" x2="440" y2="256" />
    <line x1="72" y1="352" x2="440" y2="352" />
    <line x1="160" y1="72" x2="160" y2="440" />
    <line x1="256" y1="72" x2="256" y2="440" />
    <line x1="352" y1="72" x2="352" y2="440" />
  </g>

  <!-- Ambient Central Neural Aura -->
  <circle cx="256" cy="256" r="150" fill="url(#pulseGlow)" />

  <!-- Futuristic Monogram "N" -->
  <!-- Left Vertical Stem -->
  <path d="M 132 376 L 132 136 Q 132 120 148 120 L 176 120 Q 192 120 192 136 L 192 376 Q 192 392 176 392 L 148 392 Q 132 392 132 376 Z" 
        fill="url(#pillarLeft)" />

  <!-- Right Vertical Stem -->
  <path d="M 320 376 L 320 136 Q 320 120 336 120 L 364 120 Q 380 120 380 136 L 380 376 Q 380 392 364 392 L 336 392 Q 320 392 320 376 Z" 
        fill="url(#pillarRight)" />

  <!-- Cyber Diagonal Traverse -->
  <path d="M 174 134 L 338 378 Q 350 396 368 386 Q 382 374 372 356 L 208 112 Q 196 94 178 104 Q 164 116 174 134 Z" 
        fill="url(#diagBridge)" />

  <!-- Synaptic Perception Nodes & Constellation Sparks -->
  <circle cx="162" cy="136" r="14" fill="#FAF7F2" stroke="#6A8E9E" stroke-width="4" />
  <circle cx="350" cy="376" r="14" fill="#FAF7F2" stroke="#6D8B74" stroke-width="4" />
  <circle cx="256" cy="256" r="18" fill="#7AE5A6" stroke="#FAF7F2" stroke-width="4" />

  <!-- Glowing Core Star at Center Synapse -->
  <polygon points="256,234 263,249 278,256 263,263 256,278 249,263 234,256 249,249" fill="#FAF7F2" />
</svg>
